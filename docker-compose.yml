version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dispatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/dispatch
      # The rest will be loaded from .env.local
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy

  mcp_server:
    build: .
    command: python mcp_server/server.py
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/dispatch
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      # Tell the frontend where the backend is (inside the docker network)
      - API_BASE_URL=http://backend:8000
    env_file:
      - .env.local
    depends_on:
      - backend

volumes:
  pgdata:
